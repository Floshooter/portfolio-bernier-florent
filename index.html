<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#09090b" media="(prefers-color-scheme: dark)" />

    <title>Florent Bernier — Portfolio</title>
    <meta
      name="description"
      content="Portfolio de Florent Bernier : formation, expériences, projets, compétences et voyages."
    />
    <meta name="author" content="Florent Bernier" />

    <link rel="icon" type="image/jpeg" href="/images/florent-bernier.jpg" />
    <link rel="apple-touch-icon" href="/images/florent-bernier.jpg" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Florent Bernier" />
    <meta property="og:title" content="Florent Bernier — Portfolio" />
    <meta
      property="og:description"
      content="Portfolio de Florent Bernier : formation, expériences, projets, compétences et voyages."
    />
    <meta property="og:locale" content="fr_FR" />
    <meta property="og:locale:alternate" content="en_US" />
    <meta property="og:url" content="https://floshooter.github.io/portfolio-bernier-florent/" />
    <meta name="twitter:card" content="summary" />

    <script>
      (() => {
        const root = document.documentElement
        try {
          const base = "%BASE_URL%".replace(/\/+$/, "")
          const fullPath = window.location.pathname
          const path = base !== "" && fullPath.startsWith(base) ? fullPath.slice(base.length) : fullPath
          if (path === "/en" || path.startsWith("/en/")) {
            root.lang = "en"
          }
          const stored = window.localStorage.getItem("theme")
          const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches
          const isDark = stored === "dark" || (stored !== "light" && prefersDark)
          root.classList.toggle("dark", isDark)
          root.style.colorScheme = isDark ? "dark" : "light"
        } catch {
          root.classList.remove("dark")
          root.style.colorScheme = "light"
        }
      })()
    </script>
  </head>
  <body>
    <noscript>Ce site nécessite JavaScript. / This site requires JavaScript.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
